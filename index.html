<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3f8"><meta name="description" content="Личный табель старосты: учёт по парам, автоматические итоги и печать.">
  <title>Табель 4502 · Академия МВД</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./glass.css?v=2">

<body><div class="ambient" aria-hidden="true"></div><div id="app"><div class="loading">Загружаем табель…</div></div>

<noscript><p style="padding:24px">Для работы табеля включите JavaScript в браузере.</p></noscript>
<script>
if(location.protocol==='file:'){
  document.querySelector('.loading').innerHTML='Табель нужно открыть по ссылке GitHub Pages.<br><br>Сначала загрузите файлы по инструкции: <a href="./INSTRUCTION.html">открыть инструкцию</a>.<br><br>Запуск двойным щелчком по index.html не поддерживается.';
}
</script>
<script type="module" src="./app.js?v=2"></script></body></html>
